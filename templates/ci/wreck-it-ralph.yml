# wreck-it-ralph harness on a schedule (and optionally when another workflow fails).
# Generated by `.harness/trigger.sh github`. Review before committing:
#  - Secrets: ANTHROPIC_API_KEY (Claude Code auth). GITHUB_TOKEN is provided by Actions.
#  - TRUST: this workflow accepts the committed .harness config (commands, hooks, verify
#    commands) without the interactive /wreck-it-ralph:trust review. Only use it if changes to
#    .harness/ go through code review like any other code.
#  - Runs use rollout __ROLLOUT__: work happens on a harness/* branch; L2 pushes it and opens a PR,
#    L1 only uploads the report. Nothing is ever committed to the default branch.
name: wreck-it-ralph

on:
  schedule:
    - cron: "__CRON__"
  workflow_dispatch:
    inputs:
      max_sessions:
        description: "Sessions to run"
        default: "__MAX_SESSIONS__"
__ON_FAILURE__
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wreck-it-ralph
  cancel-in-progress: false

jobs:
  harness:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the wreck-it-ralph plugin
        uses: actions/checkout@v4
        with:
          repository: __PLUGIN_REPO__
          path: .wreck-it-ralph-plugin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          npm install -g @anthropic-ai/claude-code
      - name: Prepare the harness
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/.wreck-it-ralph-plugin
        run: |
          echo ".wreck-it-ralph-plugin/" >> .git/info/exclude
          git config user.name "wreck-it-ralph[bot]"
          git config user.email "wreck-it-ralph[bot]@users.noreply.github.com"
          "$CLAUDE_PLUGIN_ROOT/scripts/harness-setup.sh" --refresh
          if [ "__ROLLOUT__" = "L2" ]; then
            jq '.rollout_push = true | .rollout_pr = true' .harness/config.json > /tmp/c.json && mv /tmp/c.json .harness/config.json
            git update-index --assume-unchanged .harness/config.json
          fi
          .harness/step.sh trust accept
      - name: Run the harness (headless)
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/.wreck-it-ralph-plugin
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          .harness/run.sh --rollout __ROLLOUT__ --max-sessions "${{ github.event.inputs.max_sessions || '__MAX_SESSIONS__' }}" || echo "harness stopped with code $?"
      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wreck-it-ralph-report
          path: |
            .harness/last-run.md
            .harness/progress.md
            .harness/sessions/
            .harness/events.jsonl
            .harness/ledger.jsonl
          if-no-files-found: ignore
